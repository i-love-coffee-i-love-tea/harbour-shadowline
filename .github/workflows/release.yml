name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  SDK_RELEASE: '5.1.0.11'
  DOCKER_IMAGE: 'coderus/sailfishos-platform-sdk:5.1.0.11'

jobs:
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          SPEC_VERSION=$(grep '^Version:' rpm/harbour-shadowline.spec | awk '{print $2}')
          APPDATA_VERSION=$(grep -oP '<release\s+version="\K[^"]+' rpm/harbour-shadowline.appdata.xml | head -1)
          echo "Spec version: $SPEC_VERSION"
          echo "AppData version: $APPDATA_VERSION"
          if [ "$SPEC_VERSION" != "$APPDATA_VERSION" ]; then
            echo "ERROR: Version mismatch! Spec=$SPEC_VERSION, AppData=$APPDATA_VERSION"
            exit 1
          fi

  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull SDK image
        run: docker image pull ${{ env.DOCKER_IMAGE }}

      - name: Build RPM package
        run: |
          chmod 777 "$PWD"
          mkdir -p rpms && chmod 777 rpms
          docker run --rm --privileged \
            -v "$PWD:/home/mersdk/project" \
            --workdir /home/mersdk/project \
            ${{ env.DOCKER_IMAGE }} \
            mb2 --no-fix-version --output-dir rpms \
                -t SailfishOS-${{ env.SDK_RELEASE }}-${{ matrix.arch }} build

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: harbour-shadowline-${{ matrix.arch }}-rpm
          path: ./rpms/*.rpm
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built RPMs
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: ./dist
        run: |
          ls -la
          sha256sum *.rpm > sha256sums.txt
          cat sha256sums.txt

      - name: Upload RPM to release
        working-directory: ./dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading missing artifacts"
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              *.rpm \
              sha256sums.txt || {
              echo "Some artifacts already exist in the release — that's OK, missing ones were added."
            }
          else
            echo "Creating release for tag: $TAG"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "shadow line $TAG" \
              --generate-notes \
              *.rpm \
              sha256sums.txt
          fi

  openrepos-publish:
    name: Publish to OpenRepos.net
    needs: [build-rpm, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download built RPMs
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@master

      - name: Install OpenRepos WebClient
        run: |
          python -m pip install --upgrade pip
          pip install openrepos-webclient

      - name: Upload RPMs to OpenRepos.net
        env:
          OPENREPOS_USERNAME: ${{ secrets.OPENREPOS_USERNAME }}
          OPENREPOS_PASSWORD: ${{ secrets.OPENREPOS_PASSWORD }}
        run: |
          if [ -z "$OPENREPOS_USERNAME" ] || [ -z "$OPENREPOS_PASSWORD" ]; then
            echo "::warning ::OPENREPOS_USERNAME or OPENREPOS_PASSWORD secret is not configured. Skipping OpenRepos upload."
            exit 0
          fi

          for RPM in ./dist/*.aarch64.rpm ./dist/*.armv7hl.rpm ./dist/*.i486.rpm; do
            if [ ! -f "$RPM" ]; then
              echo "::warning ::$RPM not found, skipping"
              continue
            fi
            echo "Uploading $(basename "$RPM")..."
            openrepos \
              --username "$OPENREPOS_USERNAME" \
              --password "$OPENREPOS_PASSWORD" \
              --xvfb \
              --webdriver chrome \
              upload-rpm \
                --appname harbour-shadowline \
                --platform SailfishOS \
                --category Applications \
                "$RPM" || echo "::warning ::Failed to upload $(basename "$RPM"), continuing"
          done
